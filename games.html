<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الألعاب التفاعلية · منصة بنفسجو</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"><style>
:root{--bg:#F3FBFC;--paper:#FFFFFF;--line:#CDE9F0;--fg:#10303B;--muted:#557585;--navy:#0B6E8F;--navy-fg:#FFFFFF;--accent:#5B7FE6;--sun:#C9F3EE;--ok:#1B7F3B;--ok-soft:#E8F7EE;--lock:#B23A3A;--shadow:0 6px 22px rgba(15,58,107,.10);--f:"Tajawal","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07222B;--paper:#0F3542;--line:#1E4E5E;--fg:#EDF2F9;--muted:#A9D1DC;--navy:#2A9CBF;--accent:#AFC6FF;--sun:#8EE3DC;--ok:#5CCB7E;--ok-soft:#173224;--lock:#FF8A8A;--shadow:0 6px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07222B;--paper:#0F3542;--line:#1E4E5E;--fg:#EDF2F9;--muted:#A9D1DC;--navy:#2A9CBF;--accent:#AFC6FF;--sun:#8EE3DC;--ok:#5CCB7E;--ok-soft:#173224;--lock:#FF8A8A;--shadow:0 6px 22px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{direction:rtl}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.55;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;color:var(--navy);white-space:nowrap}
.logo i{font-style:normal;background:var(--sun);color:#0B6E8F;border-radius:10px;padding:1px 10px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--fg);outline:none}
.pill{font:inherit;font-weight:800;font-size:15px;padding:8px 16px;border-radius:999px;border:2px solid var(--navy);background:var(--navy);color:var(--navy-fg);cursor:pointer;white-space:nowrap}
.pill.ok{background:var(--ok);border-color:var(--ok)}
.hero{margin:14px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero h1{font-size:30px;margin:0;color:var(--navy);line-height:1.3;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{font:inherit;font-weight:700;font-size:14px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.sect{font-size:22px;color:var(--navy);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sect small{font-size:14px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:right;padding:0;font:inherit;color:var(--fg);display:flex;flex-direction:column}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);outline:none;border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:#0B6E8F;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,58,107,0);transition:background .15s}
.thumb .play b{width:54px;height:54px;border-radius:50%;background:var(--sun);color:#0B6E8F;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:0;transform:scale(.8);transition:all .15s;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card:hover .thumb .play{background:rgba(15,58,107,.25)}.card:hover .thumb .play b{opacity:1;transform:scale(1)}
.badge{position:absolute;top:8px;right:8px;font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--sun);color:#0B6E8F}
.badge.lock{background:rgba(255,255,255,.92);color:var(--lock)}.badge.open{background:var(--ok);color:#fff}
.cb{padding:10px 12px 12px;display:grid;gap:3px}
.cb h3{margin:0;font-size:17px;line-height:1.35}.cb p{margin:0;font-size:13.5px;color:var(--muted)}
.cb .tg{font-size:12px;color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px}
.foot{margin-top:28px;color:var(--muted);font-size:14px;text-align:center}
/* نافذة التفاصيل */
.ov{position:fixed;inset:0;background:rgba(10,20,40,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--paper);color:var(--fg);border-radius:18px;max-width:860px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow);position:relative}
.dlg .x{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--fg);font-size:20px;cursor:pointer;z-index:2}
.dlg .hd{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
@media (max-width:700px){.dlg .hd{grid-template-columns:1fr}}
.dlg .thumb{aspect-ratio:16/9;border-radius:18px 0 0 0}
@media (max-width:700px){.dlg .thumb{border-radius:18px 18px 0 0}}
.dlg .thumb .play b{opacity:1;transform:none;width:72px;height:72px;font-size:32px}
.dlg .info{padding:18px 20px}
.dlg h2{margin:0 0 4px;font-size:24px;color:var(--navy);line-height:1.3}
.dlg .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.dlg .meta span{font-size:13px;background:var(--bg);border-radius:999px;padding:2px 10px;font-weight:700}
.dlg .bd{padding:0 20px 20px;display:grid;gap:10px}
.dlg h4{margin:6px 0 2px;font-size:16px;color:var(--navy)}
.dlg ul{margin:0;padding-right:18px}.dlg li{font-size:15px}
.dlg .min{padding:26px 26px 22px;text-align:center}.dlg .min h2{margin:0 0 10px;font-size:26px;color:var(--navy)}.dlg .min .where{margin:0 auto 18px;max-width:520px;font-size:17px;line-height:1.7;color:var(--fg)}.dlg .min .btns{justify-content:center;margin-top:6px}.dlg .min .lockmsg{margin-bottom:12px}
.dlg .lockmsg{background:#FFF6DF;color:#7A4B00;border-radius:10px;padding:8px 12px;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{font:inherit;font-weight:800;font-size:17px;padding:10px 20px;border-radius:12px;border:2px solid var(--navy);background:var(--navy);color:var(--navy-fg);cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--paper);color:var(--navy)}

.gate label{display:block;font-weight:700;font-size:15px;margin:8px 0 4px}
.gate input{width:100%;font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--fg)}
.gate input#code{direction:ltr;text-align:center;letter-spacing:2px;text-transform:uppercase}

.toast.on{opacity:1}

 const toast=$('#toast');function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('on'),2600);}
 async function sha(t){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16);}
 let acc=null,unlocked=false;try{acc=JSON.parse(localStorage.getItem('rq_access')||'null');}catch(e){}
 async function check(){try{unlocked=!!(acc&&acc.code&&HS.includes(await sha(acc.code.trim().toUpperCase())));}catch(e){unlocked=false;}
   $('#loginbtn').textContent=unlocked?('✓ '+(acc.name||'مشترك')):'🔑 دخول المشتركين';$('#loginbtn').classList.toggle('ok',unlocked);render();}
 let flt='all',q='';
 function badge(g){return g.free?'<span class="badge">مجاني</span>':(unlocked?'<span class="badge open">✓ مفتوح</span>':'<span class="badge lock">🔒 للمشتركين</span>');}
 function render(){const list=G.filter(g=>(flt==='all'||(flt==='free')===g.free)&&(!q||(g.title+' '+g.tag+' '+g.desc+' '+g.learn.join(' ')).includes(q)));
   $('#grid').innerHTML=list.map(g=>'<button class="card" data-id="'+g.id+'"><div class="thumb"><img loading="lazy" src="'+g.thumb+'" alt=""><div class="play"><b>▶</b></div>'+badge(g)+'</div><div class="cb"><h3>'+esc(g.icon+' '+g.title)+'</h3></div></button>').join('');
   $('#empty').hidden=list.length>0;$('#count').textContent=list.length+' من '+G.length;
   document.querySelectorAll('.card').forEach(b=>b.onclick=()=>open(b.dataset.id));}
 document.querySelectorAll('#tags .chip').forEach(b=>b.onclick=()=>{flt=b.dataset.g;document.querySelectorAll('#tags .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
 $('#q').oninput=e=>{q=e.target.value.trim();render();};
 function modal(html){const ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><button class="x" aria-label="إغلاق">✕</button>'+html+'</div>';document.body.appendChild(ov);const close=()=>ov.remove();ov.querySelector('.x').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k);}});return ov;}
 function open(id){const g=G.find(x=>x.id===id);const can=g.free||unlocked;
   const i=G.indexOf(g);const nx=G[i+1];
   const ov=modal('<div class="min"><h2>'+esc(g.icon+' '+g.title)+'</h2><p class="where">'+esc(g.desc)+'</p>'+(can?'':'<div class="lockmsg">🔒 للمشتركين — أدخل رمز الاشتراك</div>')+'<div class="btns">'+(can?'<a class="btn" href="'+g.file+'">▶ تشغيل</a>':'<button class="btn" id="unlock">🔑 رمز الاشتراك</button>')+(nx?'<button class="btn alt" id="nxt">اللعبة التالية ←</button>':'')+'</div></div>');
   const u=ov.querySelector('#unlock');if(u)u.onclick=()=>{ov.remove();gate();};const n=ov.querySelector('#nxt');if(n)n.onclick=()=>{ov.remove();open(nx.id);};}
 function gate(){const ov=modal('<form class="gate" style="padding:22px 22px 18px"><h2 style="margin:0 0 6px;color:var(--navy)">🔑 دخول المشتركين</h2><p style="margin:0;color:var(--muted);font-size:15px">أدخل رمزك مرة واحدة على هذا الجهاز وتُفتح جميع الألعاب والمحطات.</p><label for="sname">اسمك</label><input id="sname" type="text" placeholder="الاسم الثلاثي" autocomplete="name"><label for="code">رمز الاشتراك</label><input id="code" type="text" placeholder="مثال: STAR-305" autocomplete="off"><div class="btns"><button class="btn" type="submit">فتح الجميع</button></div><div class="msg" id="msg"></div><p class="buy">ليس لديك رمز؟ تواصل مع أ. رناد حماد للاشتراك والحصول على رمزك الخاص.</p></form>');
   const f=ov.querySelector('form'),msg=ov.querySelector('#msg');if(acc){f.sname.value=acc.name||'';f.code.value=acc.code||'';}f.sname.focus();
   f.onsubmit=async e=>{e.preventDefault();const name=f.sname.value.trim(),code=f.code.value.trim().toUpperCase();if(!name){msg.className='msg bad';msg.textContent='اكتب اسمك أولًا';return;}
     let ok=false;try{ok=HS.includes(await sha(code));}catch(err){msg.className='msg bad';msg.textContent='المتصفح لا يدعم التحقق هنا — افتح المنصة من رابطها على الإنترنت.';return;}
     if(!ok){msg.className='msg bad';msg.textContent='الرمز غير صحيح. تأكد من كتابته كما وصلك.';return;}
     acc={name,code,at:Date.now()};try{localStorage.setItem('rq_access',JSON.stringify(acc));}catch(err){}msg.className='msg ok';msg.textContent='تم تفعيل اشتراكك ✓';await check();setTimeout(()=>{ov.remove();say('مرحبًا '+name+'! جميع الألعاب مفتوحة');},600);};}
 $('#loginbtn').onclick=gate;
 check().then(()=>{if(location.hash==='#locked'&&!unlocked){say('هذه اللعبة للمشتركين — أدخل رمز الاشتراك');gate();}});
})();
</script>
</body></html>
